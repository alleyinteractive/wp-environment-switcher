name: Playwright Tests
on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
jobs:
  playwright-test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      # See https://github.com/alleyinteractive/action-test-node for more options
      uses: alleyinteractive/action-test-node@v1
      with:
        node-version: 26
        # Playwright needs wp-env running, so the tests run in their own step below.
        skip-test: 'true'
        skip-build: 'true'
    - name: Install Playwright Browsers
      run: npx playwright install chromium --with-deps
    - name: Install and start wp-env
      timeout-minutes: 5
      run: |
        npm install --global @wordpress/env
        wp-env start

        # Wait for the server to be ready
        while ! curl -s http://localhost:8888 > /dev/null; do
          sleep 1
        done
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
