name: Update WordPress Plugin

on:
  schedule:
    - cron: '0 6 1 * *' # Run on the first day of every month at 6am UTC.

permissions:
  contents: write
  pull-requests: write

jobs:
  update-plugin:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: alleyinteractive/action-update-wordpress-plugin@v2
      with:
        plugin-file: 'wp-environment-switcher.php'
        # The upgrade step runs `npm ci` and `wp-scripts packages-update`; this repo has neither a lockfile nor wp-scripts.
        upgrade-npm-dependencies: "false"
